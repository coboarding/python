apiVersion: apps/v1
kind: Deployment
metadata:
  name: novnc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novnc
  template:
    metadata:
      labels:
        app: novnc
    spec:
      containers:
      - name: novnc
        image: theasp/novnc:latest
        ports:
        - containerPort: 6080
        env:
        - name: VNC_PASSWORD
          value: "password"
---
apiVersion: v1
kind: Service
metadata:
  name: novnc
spec:
  type: NodePort
  ports:
    - port: 6080
      targetPort: 6080
      nodePort: 30080
  selector:
    app: novnc
