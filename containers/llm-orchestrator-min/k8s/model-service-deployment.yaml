apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      containers:
      - name: model-service
        image: llm-model-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: MODEL_PATH
          value: /app/models/tinyllama
        - name: USE_INT8
          value: "true"
        - name: MODEL_SERVICE_PORT
          value: "5000"
        volumeMounts:
        - name: model-cache
          mountPath: /app/models
        - name: pip-cache
          mountPath: /root/.cache/pip
        - name: models-cache
          mountPath: /app/.cache/models
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc
      - name: pip-cache
        persistentVolumeClaim:
          claimName: pip-cache-pvc
      - name: models-cache
        persistentVolumeClaim:
          claimName: models-cache-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pip-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
